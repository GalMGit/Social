services:

  # =========================
  # Infrastructure
  # =========================

  postgres:
    image: postgres:18
    container_name: social-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: social-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: social-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Observability
  # =========================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: social-otel-collector
    restart: unless-stopped
    command:
      [
        "--config=/etc/otel/config.yaml"
      ]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: social-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:3.7.9
    container_name: social-loki
    restart: unless-stopped
    command:
      [
        "-config.file=/etc/loki/loki.yaml"
      ]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.10.10
    container_name: social-tempo
    restart: unless-stopped
    command:
      [
        "-config.file=/etc/tempo/tempo.yaml"
      ]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:12.4.14
    container_name: social-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Гасим только «шумные» логгеры: запросы к Loki, HTTP-запросы и сервис
      # дашбордов. Реальные предупреждения и ошибки остаются.
      GF_LOG_FILTERS: "tsdb.loki:error,context:error,dashboard-service:error,bleve-backend:error,infra.usagestats:error"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # =========================
  # Email
  # =========================

  social.emailworker:
    image: social.emailworker
    container_name: social-emailworker
    build:
      context: .
      dockerfile: src/Services/Email/Social.EmailWorker/Dockerfile
    environment:
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}

      EmailOptions__SmtpServer: ${SMTP_SERVER}
      EmailOptions__Port: ${SMTP_PORT}
      EmailOptions__Username: ${SMTP_USERNAME}
      EmailOptions__Password: ${SMTP_PASSWORD}
      EmailOptions__SenderEmail: ${SMTP_SENDER_EMAIL}
      EmailOptions__SenderName: ${SMTP_SENDER_NAME}

    depends_on:
      rabbitmq:
        condition: service_healthy

  # =========================
  # Identity
  # =========================

  social.identity:
    image: social.identity
    container_name: social-identity
    build:
      context: .
      dockerfile: src/Services/Identity/Social.Identity/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      Observability__OtlpEndpoint: http://otel-collector:4317
      # Экспорт метрик раз в 15s вместо дефолтных 60s — дашборд отзывается быстрее.
      OTEL_METRIC_EXPORT_INTERVAL: "15000"

      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=${IDENTITY_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

      Identity__Admin__Username: ${ADMIN_USERNAME}
      Identity__Admin__Email: ${ADMIN_EMAIL}
      Identity__Admin__Password: ${ADMIN_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================
  # Users
  # =========================

  social.users:
    image: social.users
    container_name: social-users
    build:
      context: .
      dockerfile: src/Services/Users/Social.Users/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      Observability__OtlpEndpoint: http://otel-collector:4317
      # Экспорт метрик раз в 15s вместо дефолтных 60s — дашборд отзывается быстрее.
      OTEL_METRIC_EXPORT_INTERVAL: "15000"

      ConnectionStrings__UsersDb: Host=postgres;Port=5432;Database=${USERS_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

      MediaOptions__BaseUrl: https://ccc4224abb9e-nothing-public.s3.ru1.storage.beget.cloud

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # =========================
  # Posts
  # =========================

  social.posts:
    image: social.posts
    container_name: social-posts
    build:
      context: .
      dockerfile: src/Services/Posts/Social.Posts/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      Observability__OtlpEndpoint: http://otel-collector:4317
      # Экспорт метрик раз в 15s вместо дефолтных 60s — дашборд отзывается быстрее.
      OTEL_METRIC_EXPORT_INTERVAL: "15000"

      ConnectionStrings__PostsDb: Host=postgres;Port=5432;Database=${POSTS_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

      MediaOptions__BaseUrl: https://ccc4224abb9e-nothing-public.s3.ru1.storage.beget.cloud

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================
  # Communities
  # =========================

  social.communities:
    image: social.communities
    container_name: social-communities
    build:
      context: .
      dockerfile: src/Services/Communities/Social.Communities/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      Observability__OtlpEndpoint: http://otel-collector:4317
      # Экспорт метрик раз в 15s вместо дефолтных 60s — дашборд отзывается быстрее.
      OTEL_METRIC_EXPORT_INTERVAL: "15000"

      ConnectionStrings__CommunitiesDb: Host=postgres;Port=5432;Database=${COMMUNITIES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================
  # Comments
  # =========================

  social.comments:
    image: social.comments
    container_name: social-comments
    build:
      context: .
      dockerfile: src/Services/Comments/Social.Comments/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      Observability__OtlpEndpoint: http://otel-collector:4317
      # Экспорт метрик раз в 15s вместо дефолтных 60s — дашборд отзывается быстрее.
      OTEL_METRIC_EXPORT_INTERVAL: "15000"

      ConnectionStrings__CommentsDb: Host=postgres;Port=5432;Database=${COMMENTS_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # =========================
  # Media
  # =========================

  social.media:
    image: social.media
    container_name: social-media
    build:
      context: .
      dockerfile: src/Services/Media/Social.Media/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      Observability__OtlpEndpoint: http://otel-collector:4317
      # Экспорт метрик раз в 15s вместо дефолтных 60s — дашборд отзывается быстрее.
      OTEL_METRIC_EXPORT_INTERVAL: "15000"

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

      PublicStorageOptions__ServiceUrl: ${PUBLIC_STORAGE_OPTIONS__SERVICE_URL}
      PublicStorageOptions__Bucket: ${PUBLIC_STORAGE_OPTIONS__BUCKET}
      PublicStorageOptions__AccessKey: ${PUBLIC_STORAGE_OPTIONS__ACCESS_KEY}
      PublicStorageOptions__SecretKey: ${PUBLIC_STORAGE_OPTIONS__SECRET_KEY}
      PublicStorageOptions__BaseUrl: ${PUBLIC_STORAGE_OPTIONS__BASE_URL}

      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}

    depends_on:
      rabbitmq:
        condition: service_healthy

  # =========================
  # Gateway
  # =========================

  social.gateway:
    image: social.gateway
    container_name: social-gateway
    build:
      context: .
      dockerfile: src/Gateway/Social.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      Observability__OtlpEndpoint: http://otel-collector:4317
      # Экспорт метрик раз в 15s вместо дефолтных 60s — дашборд отзывается быстрее.
      OTEL_METRIC_EXPORT_INTERVAL: "15000"

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

    ports:
      - "${GATEWAY_PORT}:8080"

    depends_on:
      - social.identity
      - social.users
      - social.posts
      - social.communities
      - social.comments
      - social.media

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data: