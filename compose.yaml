services:

  # =========================
  # Infrastructure
  # =========================

  postgres:
    image: postgres:18
    container_name: social-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: social-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: social-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Email
  # =========================

  social.emailworker:
    image: social.emailworker
    container_name: social-emailworker
    build:
      context: .
      dockerfile: src/Services/Email/Social.EmailWorker/Dockerfile
    environment:
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}

      EmailOptions__SmtpServer: ${SMTP_SERVER}
      EmailOptions__Port: ${SMTP_PORT}
      EmailOptions__Username: ${SMTP_USERNAME}
      EmailOptions__Password: ${SMTP_PASSWORD}
      EmailOptions__SenderEmail: ${SMTP_SENDER_EMAIL}
      EmailOptions__SenderName: ${SMTP_SENDER_NAME}

    depends_on:
      rabbitmq:
        condition: service_healthy

  # =========================
  # Identity
  # =========================

  social.identity:
    image: social.identity
    container_name: social-identity
    build:
      context: .
      dockerfile: src/Services/Identity/Social.Identity/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=${IDENTITY_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

      Identity__Admin__Username: ${ADMIN_USERNAME}
      Identity__Admin__Email: ${ADMIN_EMAIL}
      Identity__Admin__Password: ${ADMIN_PASSWORD}

    ports:
      - "${IDENTITY_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================
  # Users
  # =========================

  social.users:
    image: social.users
    container_name: social-users
    build:
      context: .
      dockerfile: src/Services/Users/Social.Users/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      ConnectionStrings__UsersDb: Host=postgres;Port=5432;Database=${USERS_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

      MediaOptions__BaseUrl: https://ccc4224abb9e-nothing-public.s3.ru1.storage.beget.cloud

    ports:
      - "${USERS_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  # =========================
  # Posts
  # =========================

  social.posts:
    image: social.posts
    container_name: social-posts
    build:
      context: .
      dockerfile: src/Services/Posts/Social.Posts/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      ConnectionStrings__PostsDb: Host=postgres;Port=5432;Database=${POSTS_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

      MediaOptions__BaseUrl: https://ccc4224abb9e-nothing-public.s3.ru1.storage.beget.cloud

    ports:
      - "${POSTS_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================
  # Comments
  # =========================

  social.comments:
    image: social.comments
    container_name: social-comments
    build:
      context: .
      dockerfile: src/Services/Comments/Social.Comments/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      ConnectionStrings__CommentsDb: Host=postgres;Port=5432;Database=${COMMENTS_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

    ports:
      - "${COMMENTS_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  # =========================
  # Media
  # =========================

  social.media:
    image: social.media
    container_name: social-media
    build:
      context: .
      dockerfile: src/Services/Media/Social.Media/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

      PublicStorageOptions__ServiceUrl: ${PUBLIC_STORAGE_OPTIONS__SERVICE_URL}
      PublicStorageOptions__Bucket: ${PUBLIC_STORAGE_OPTIONS__BUCKET}
      PublicStorageOptions__AccessKey: ${PUBLIC_STORAGE_OPTIONS__ACCESS_KEY}
      PublicStorageOptions__SecretKey: ${PUBLIC_STORAGE_OPTIONS__SECRET_KEY}
      PublicStorageOptions__BaseUrl: ${PUBLIC_STORAGE_OPTIONS__BASE_URL}

    ports:
      - "${MEDIA_PORT}:8080"

  # =========================
  # Gateway
  # =========================

  social.gateway:
    image: social.gateway
    container_name: social-gateway
    build:
      context: .
      dockerfile: src/Gateway/Social.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Expires: ${JWT_EXPIRES}

    ports:
      - "${GATEWAY_PORT}:8080"

    depends_on:
      - social.identity
      - social.users
      - social.posts
      - social.comments
      - social.media


volumes:
  postgres_data:
  rabbitmq_data:
  redis_data: