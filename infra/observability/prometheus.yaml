global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Коллектор собирает OTLP от сервисов и публикует метрики здесь.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
